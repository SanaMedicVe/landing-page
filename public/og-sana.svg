<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#003f6e"/>
      <stop offset="100%" stop-color="#0fb6cc"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#g)"/>
  <!-- grid sutil -->
  <g opacity="0.25">
    <path d="M0 320 L1200 320" stroke="#ffffff" stroke-opacity="0.05"/>
    <path d="M0 280 L1200 280" stroke="#ffffff" stroke-opacity="0.05"/>
    <path d="M0 360 L1200 360" stroke="#ffffff" stroke-opacity="0.05"/>
  </g>
  <!-- ECG -->
  <g stroke="url(#grid)" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M40 320 L220 320 L260 290 L290 350 L320 320 L420 320 L450 250 L480 390 L510 320 L640 320 L680 290 L710 350 L740 320 L900 320 L940 250 L970 390 L1000 320 L1160 320"/>
  </g>
  <!-- pulse dot -->
  <circle cx="220" cy="320" r="9" fill="#0fb6cc">
    <animate attributeName="r" values="6;12;6" dur="1s" repeatCount="indefinite"/>
  </circle>
  <!-- marca -->
  <g transform="translate(80,140)">
    <rect width="72" height="72" rx="18" fill="#ffffff"/>
    <path d="M16 36 L26 36 L32 26 L38 46 L44 36 L56 36" fill="none" stroke="#003f6e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="170" y="200" font-family="'Comfortaa', 'Caviar Dreams', system-ui, sans-serif" font-size="44" font-weight="700" fill="#ffffff">Sana</text>
  <text x="80" y="380" font-family="'Comfortaa', 'Caviar Dreams', system-ui, sans-serif" font-size="68" font-weight="700" fill="#ffffff">Tu salud, conectada</text>
  <text x="80" y="460" font-family="'Comfortaa', 'Caviar Dreams', system-ui, sans-serif" font-size="68" font-weight="700" fill="#7cd9e7">en tiempo real.</text>
  <text x="80" y="540" font-family="'Open Sans', system-ui, sans-serif" font-size="26" fill="#ffffff" opacity="0.85">Pacientes y doctores verificados en una sola plataforma — LATAM.</text>
  <text x="80" y="585" font-family="ui-monospace, monospace" font-size="18" fill="#ffffff" opacity="0.6" letter-spacing="2">SANA.LAT</text>
</svg>
